name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build KulinarPro Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npx vite build

      - name: Install Capacitor and add Android platform
        run: |
          npm install --legacy-peer-deps @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "КулинарПро" "ru.kulinarpro.app" --web-dir dist
          fi
          npx cap add android
          npx cap sync android

      - name: Apply app launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image

          icon = Image.open("public/pwa-512x512.png").convert("RGBA")
          maskable = Image.open("public/pwa-maskable-512x512.png").convert("RGBA")
          res_dir = "android/app/src/main/res"

          sizes = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432),
          }

          for density, (std_sz, fg_sz) in sizes.items():
              folder = os.path.join(res_dir, f"mipmap-{density}")
              if os.path.isdir(folder):
                  icon.resize((std_sz, std_sz), Image.LANCZOS).save(os.path.join(folder, "ic_launcher.png"))
                  icon.resize((std_sz, std_sz), Image.LANCZOS).save(os.path.join(folder, "ic_launcher_round.png"))
                  maskable.resize((fg_sz, fg_sz), Image.LANCZOS).save(os.path.join(folder, "ic_launcher_foreground.png"))
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KulinarPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
